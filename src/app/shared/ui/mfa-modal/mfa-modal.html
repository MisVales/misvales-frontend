@if (mfaReauthService.isModalOpen()) {
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-gray-900 bg-opacity-50 backdrop-blur-sm transition-opacity">
  <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm transform transition-all duration-300">
    <div class="flex items-center gap-3 mb-4">
      <div class="bg-[#e9ecef] p-2 rounded-full">
        <lucide-icon name="shield" class="w-6 h-6 text-[#386641]"></lucide-icon>
      </div>
      <h2 class="text-xl font-bold text-gray-800">Autenticación Requerida</h2>
    </div>
    
    <p class="text-sm text-gray-600 mb-6">
      Esta acción requiere confirmación de identidad. Por favor, ingresa el código generado por tu aplicación autenticadora.
    </p>

    <div class="mb-6">
      <label for="totp" class="block text-sm font-medium text-gray-700 mb-2">Código de 6 dígitos</label>
      <input
        type="text"
        id="totp"
        class="w-full px-4 py-2 text-center text-2xl tracking-widest border border-gray-300 rounded-lg focus:ring-[#386641] focus:border-[#386641] outline-none transition-colors"
        maxlength="6"
        placeholder="000000"
        [ngModel]="totpCode()"
        (ngModelChange)="totpCode.set($event)"
        (keyup.enter)="submit()"
        autofocus
      />
    </div>

    <div class="flex justify-end gap-3">
      <button
        (click)="cancel()"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-300"
      >
        Cancelar
      </button>
      <button
        (click)="submit()"
        [disabled]="totpCode().length !== 6"
        class="px-4 py-2 text-sm font-medium text-white bg-[#386641] hover:bg-[#2c5234] rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#386641]"
      >
        Confirmar
      </button>
    </div>
  </div>
</div>
}
