<form [formGroup]="form" class="space-y-4">
  <!-- Estado y Municipio -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gray-700">Estado</label>
      <ng-select [items]="states"
                 bindLabel="name"
                 bindValue="id"
                 formControlName="state"
                 placeholder="Selecciona un estado..."
                 class="w-full text-sm">
      </ng-select>
    </div>
    <div>
      <label class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gray-700">Municipio</label>
      <ng-select [items]="municipalities"
                 bindLabel="name"
                 bindValue="id"
                 formControlName="municipality"
                 placeholder="Selecciona un municipio..."
                 class="w-full text-sm">
      </ng-select>
    </div>
  </div>

  <!-- CP y Colonia -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gray-700">Código Postal</label>
      <input type="text" formControlName="zipCode" placeholder="Ej. 27000" maxlength="5"
        class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
    </div>
    <div>
      <label class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gray-700">Colonia</label>
      <ng-select [items]="colonies"
                 bindLabel="name"
                 bindValue="id"
                 formControlName="colony"
                 placeholder="Selecciona una colonia..."
                 class="w-full text-sm">
      </ng-select>
    </div>
  </div>

  <!-- Calle (Autocomplete) y Números -->
  <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
    <div class="md:col-span-8 relative">
      <label class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gray-700">Calle</label>
      <input type="text" formControlName="street" placeholder="Ej. Av. Morelos"
        class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
      
      <!-- Autocomplete Dropdown -->
      <ul *ngIf="streetSuggestions.length > 0" class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-auto">
        <li *ngFor="let suggestion of streetSuggestions" (click)="selectSuggestion(suggestion)"
            class="px-4 py-2 hover:bg-blue-50 cursor-pointer text-sm">
          {{ suggestion.properties.formatted }}
        </li>
      </ul>
    </div>
    <div class="md:col-span-2">
      <label class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gray-700">No. Ext</label>
      <input type="text" formControlName="exteriorNumber"
        class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
    </div>
    <div class="md:col-span-2">
      <label class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gray-700">No. Int</label>
      <input type="text" formControlName="interiorNumber" placeholder="Opcional"
        class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
    </div>
  </div>
</form>
