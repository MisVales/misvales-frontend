<div class="fixed top-4 left-0 right-0 z-[2000] flex flex-col items-center pointer-events-none space-y-2 px-4" aria-label="Avisos de la aplicación">
  @for (alert of alertService.alerts(); track alert.id) {
    <div 
      class="max-w-md w-full pointer-events-auto rounded-lg shadow-lg border p-4 flex items-start gap-3 transition-all animate-in fade-in slide-in-from-top-4 duration-300"
      [ngClass]="getColorClasses(alert.type)"
      [attr.role]="alert.type === 'error' ? 'alert' : 'status'"
      [attr.aria-live]="alert.type === 'error' ? 'assertive' : 'polite'"
      aria-atomic="true"
    >
      <lucide-icon 
        [name]="getIconName(alert.type)" 
        class="w-5 h-5 flex-shrink-0 mt-0.5"
        [ngClass]="getIconColorClass(alert.type)"
        aria-hidden="true"
      ></lucide-icon>
      
      <div class="flex-grow">
        <p class="text-sm font-medium">{{ alert.message }}</p>
      </div>

      <button 
        type="button"
        (click)="alertService.removeAlert(alert.id)"
        [attr.aria-label]="'Cerrar aviso: ' + alert.message"
        class="flex-shrink-0 text-current opacity-70 hover:opacity-100 transition-opacity p-1 -m-1"
      >
        <lucide-icon name="x" class="w-4 h-4" aria-hidden="true"></lucide-icon>
      </button>
    </div>
  }
</div>
