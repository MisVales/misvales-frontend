<div class="alert-viewport" aria-label="Avisos de la aplicación">
  @for (alert of alertService.alerts(); track alert.id) {
    <div 
      class="app-toast"
      [class.app-toast--closing]="alert.closing"
      [ngClass]="getColorClasses(alert.type)"
      [attr.role]="alert.type === 'error' ? 'alert' : 'status'"
      [attr.aria-live]="alert.type === 'error' ? 'assertive' : 'polite'"
      aria-atomic="true"
    >
      <lucide-icon 
        [name]="getIconName(alert.type)" 
        class="w-5 h-5 flex-shrink-0 mt-0.5"
        [ngClass]="getIconColorClass(alert.type)"
        aria-hidden="true"
      ></lucide-icon>
      
      <div class="toast-copy">
        <strong>{{ title(alert.type) }}</strong>
        <p>{{ alert.message }}</p>
      </div>

      <button 
        type="button"
        (click)="alertService.removeAlert(alert.id)"
        [attr.aria-label]="'Cerrar aviso: ' + alert.message"
        class="toast-close"
      >
        <lucide-icon name="x" class="w-4 h-4" aria-hidden="true"></lucide-icon>
      </button>
      @if (alert.duration > 0) { <span class="toast-progress" [style.--alert-duration.ms]="alert.duration" aria-hidden="true"></span> }
    </div>
  }
</div>
