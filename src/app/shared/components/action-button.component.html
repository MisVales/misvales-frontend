<button
  mat-button
  [type]="buttonType()"
  [class]="'button ' + variant()"
  [disabled]="disabled() || pending()"
  [attr.aria-label]="accessibleLabel()"
  [attr.aria-busy]="pending()"
  (click)="activated.emit()"
>
  <ng-content />
  @if (pending()) {
    <span class="mv-sr-only">Acción en proceso</span>
  }
</button>
