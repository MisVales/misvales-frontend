<div class="mx-auto max-w-5xl p-6">
  <a routerLink="/clientes" class="text-[#386641] hover:underline flex items-center gap-1 text-sm font-medium mb-4">
    &larr; Volver a clientes
  </a>
  
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Alta de Cliente</h1>
    <p class="text-sm text-gray-600">El registro solo está disponible para la distribuidora activa responsable.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="confirmar()" class="rounded-2xl bg-white p-6 shadow-sm border border-gray-100 space-y-8">
    
    <!-- SECCIÓN 1: IDENTIDAD -->
    <div>
      <h2 class="text-lg font-bold text-[#386641] border-b border-gray-100 pb-2 mb-4">1. Identidad</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Nombre(s) *</label>
          <input class="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-[#386641] focus:ring-1 focus:ring-[#386641] outline-none" formControlName="first_name" placeholder="Ej. Juan">
          <app-input-error [control]="form.controls.first_name" label="El nombre"></app-input-error>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Primer Apellido *</label>
          <input class="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-[#386641] focus:ring-1 focus:ring-[#386641] outline-none" formControlName="first_last_name" placeholder="Ej. Pérez">
          <app-input-error [control]="form.controls.first_last_name" label="El primer apellido"></app-input-error>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Segundo Apellido</label>
          <input class="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-[#386641] focus:ring-1 focus:ring-[#386641] outline-none" formControlName="second_last_name" placeholder="Ej. López">
        </div>
      </div>
    </div>

    @if (errorEnvio) {
      <div class="p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200">
        {{ errorEnvio }}
      </div>
    }
    <!-- Botones de Acción -->
    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
      <a routerLink="/clientes" class="rounded-xl border border-gray-300 px-5 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
        Cancelar
      </a>
      <button type="submit" class="rounded-xl bg-[#386641] px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-[#2c5234] disabled:opacity-50 disabled:cursor-not-allowed transition-colors" [disabled]="enviando">
        {{ enviando ? 'Registrando…' : 'Registrar Cliente' }}
      </button>
    </div>

  </form>
</div>
