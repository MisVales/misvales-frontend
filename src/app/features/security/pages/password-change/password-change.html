<div>
  <h2 class="text-xl font-bold text-gray-900 mb-6">Cambiar Contraseña</h2>
  
  @if (success()) {
    <div class="p-4 mb-6 text-sm text-green-800 rounded-lg bg-green-50 border border-green-200">
      Contraseña actualizada correctamente. Serás redirigido para iniciar sesión nuevamente.
    </div>
  }
  
  @if (error()) {
    <div class="p-4 mb-6 text-sm text-red-800 rounded-lg bg-red-50 border border-red-200">
      {{ error() }}
    </div>
  }

  <form (submit)="submit(); $event.preventDefault()" class="max-w-md space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña Actual</label>
      <input
        type="password"
        [ngModel]="currentPassword()"
        (ngModelChange)="currentPassword.set($event)"
        name="current"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-[#386641] focus:border-[#386641] outline-none"
        required
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña</label>
      <input
        type="password"
        [ngModel]="newPassword()"
        (ngModelChange)="newPassword.set($event)"
        name="newPass"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-[#386641] focus:border-[#386641] outline-none"
        required
      />
      <!-- Indicadores de Contraseña -->
      <div class="mt-3 grid grid-cols-2 gap-2 text-xs">
        <div class="flex items-center gap-1" [ngClass]="passwordCriteria().length ? 'text-green-600' : 'text-gray-400'">
          <lucide-icon *ngIf="passwordCriteria().length" name="check-circle-2" class="w-4 h-4"></lucide-icon>
          <lucide-icon *ngIf="!passwordCriteria().length" name="circle" class="w-4 h-4"></lucide-icon>
          12 caracteres
        </div>
        <div class="flex items-center gap-1" [ngClass]="passwordCriteria().uppercase ? 'text-green-600' : 'text-gray-400'">
          <lucide-icon *ngIf="passwordCriteria().uppercase" name="check-circle-2" class="w-4 h-4"></lucide-icon>
          <lucide-icon *ngIf="!passwordCriteria().uppercase" name="circle" class="w-4 h-4"></lucide-icon>
          1 Mayúscula
        </div>
        <div class="flex items-center gap-1" [ngClass]="passwordCriteria().lowercase ? 'text-green-600' : 'text-gray-400'">
          <lucide-icon *ngIf="passwordCriteria().lowercase" name="check-circle-2" class="w-4 h-4"></lucide-icon>
          <lucide-icon *ngIf="!passwordCriteria().lowercase" name="circle" class="w-4 h-4"></lucide-icon>
          1 Minúscula
        </div>
        <div class="flex items-center gap-1" [ngClass]="passwordCriteria().number ? 'text-green-600' : 'text-gray-400'">
          <lucide-icon *ngIf="passwordCriteria().number" name="check-circle-2" class="w-4 h-4"></lucide-icon>
          <lucide-icon *ngIf="!passwordCriteria().number" name="circle" class="w-4 h-4"></lucide-icon>
          1 Número
        </div>
        <div class="flex items-center gap-1" [ngClass]="passwordCriteria().symbol ? 'text-green-600' : 'text-gray-400'">
          <lucide-icon *ngIf="passwordCriteria().symbol" name="check-circle-2" class="w-4 h-4"></lucide-icon>
          <lucide-icon *ngIf="!passwordCriteria().symbol" name="circle" class="w-4 h-4"></lucide-icon>
          1 Símbolo
        </div>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar Nueva Contraseña</label>
      <input
        type="password"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        name="confirmPass"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-[#386641] focus:border-[#386641] outline-none"
        required
      />
    </div>

    <div class="pt-4">
      <button
        type="submit"
        [disabled]="loading() || !currentPassword() || !newPassword() || !confirmPassword()"
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-[#386641] hover:bg-[#2c5234] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#386641] disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (loading()) {
          <lucide-icon name="loader-2" class="w-5 h-5 animate-spin"></lucide-icon>
        } @else {
          Actualizar Contraseña
        }
      </button>
    </div>
  </form>
</div>
