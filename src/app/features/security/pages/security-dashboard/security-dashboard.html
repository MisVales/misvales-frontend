<div class="max-w-6xl mx-auto">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Seguridad y acceso</h1>
    <p class="text-gray-500 mt-2">Gestiona tu contraseña, autenticación de dos factores y sesiones activas.</p>
  </div>

  <div class="flex flex-col md:flex-row gap-8">
    <!-- Sidebar Navigation -->
    <aside class="w-full md:w-64 flex-shrink-0">
      <nav class="flex flex-row md:flex-col gap-2 overflow-x-auto pb-4 md:pb-0 scrollbar-hide">
        @for (tab of tabs; track tab.route) {
          <a
            [routerLink]="tab.route"
            routerLinkActive="bg-[#386641] text-white"
            #rla="routerLinkActive"
            [class.text-gray-600]="!rla.isActive"
            [class.hover:bg-gray-100]="!rla.isActive"
            class="flex items-center gap-3 px-4 py-3 rounded-xl transition-colors whitespace-nowrap"
          >
            <lucide-icon [name]="tab.icon" class="w-5 h-5"></lucide-icon>
            <span class="font-medium text-sm">{{ tab.title }}</span>
          </a>
        }
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-grow bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 min-h-[500px]">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
