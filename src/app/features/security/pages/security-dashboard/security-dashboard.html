<section class="security-shell">
  <header class="security-heading">
    <p>Mi cuenta</p>
    <h1>Seguridad y acceso</h1>
    <span>Administra tus datos, acceso y sesiones.</span>
  </header>
  <nav class="security-tabs" aria-label="Opciones de cuenta y seguridad">
    @for (tab of tabs; track tab.route) {
      <a [routerLink]="tab.route" routerLinkActive="security-tab--active" class="security-tab">
        <lucide-icon [name]="tab.icon" [size]="19" aria-hidden="true" /><span>{{ tab.title }}</span>
      </a>
    }
  </nav>
  <main class="security-content"><router-outlet /></main>
</section>
