<div class="max-w-2xl mx-auto bg-white shadow-xl rounded-2xl p-8 border border-gray-100 mt-6">
  <div class="text-center mb-8">
    <h2 class="text-2xl font-extrabold text-[#386641] tracking-tight">Códigos de Recuperación</h2>
  </div>
  
  <div class="mb-6 p-4 bg-yellow-50 border border-yellow-200 rounded-xl text-yellow-800 text-sm">
    <strong class="block mb-1">¡Importante!</strong> 
    Guarda estos códigos en un lugar seguro (ej. gestor de contraseñas). 
    Cada código puede usarse solo una vez para recuperar el acceso a tu cuenta si pierdes tu dispositivo TOTP.
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-8">
    @for (code of codes(); track code) {
      <div class="bg-gray-50 border border-gray-200 p-3 rounded-lg text-center font-mono text-gray-800 tracking-widest font-semibold">
        {{ code }}
      </div>
    }
  </div>

  <div class="flex justify-center mb-8">
    <button type="button" class="bg-transparent border border-[#386641] text-[#386641] hover:bg-[#386641] hover:text-white font-medium py-2 px-6 rounded-lg transition-colors" (click)="copyCodes()">
      {{ hasCopied() ? '¡Copiado!' : 'Copiar todos los códigos' }}
    </button>
  </div>

  <div class="flex items-center justify-center p-4 bg-gray-50 rounded-xl border border-gray-200">
    <label class="flex items-center gap-3 cursor-pointer">
      <input type="checkbox" [ngModel]="hasConfirmedSaved()" (ngModelChange)="hasConfirmedSaved.set($event)" class="w-5 h-5 text-[#386641] bg-white border-gray-300 rounded focus:ring-[#386641]">
      <span class="text-sm font-medium text-gray-700">Confirmo que he guardado estos códigos en un lugar seguro.</span>
    </label>
  </div>
</div>
