<div class="mx-auto max-w-5xl p-6"><a routerLink="/clientes" class="text-[#386641] hover:underline">&larr; Volver a clientes</a><h1 class="my-4 text-2xl font-bold">Alta de cliente</h1><p class="mb-5 text-sm text-gray-600">El registro solo está disponible para la distribuidora activa responsable.</p>
<form [formGroup]="form" (ngSubmit)="confirmar()" class="grid gap-4 rounded-xl bg-white p-6 shadow md:grid-cols-3">
<h2 class="text-lg font-bold md:col-span-3">Identidad</h2><label>Nombre(s)<input class="mt-1 w-full rounded border p-2" formControlName="first_name"></label><label>Primer apellido<input class="mt-1 w-full rounded border p-2" formControlName="first_last_name"></label><label>Segundo apellido<input class="mt-1 w-full rounded border p-2" formControlName="second_last_name"></label><label>CURP<input class="mt-1 w-full rounded border p-2 uppercase" maxlength="18" formControlName="curp"></label><label>RFC<input class="mt-1 w-full rounded border p-2 uppercase" formControlName="rfc"></label><label>Fecha de nacimiento<input class="mt-1 w-full rounded border p-2" type="date" formControlName="birth_date"></label><label>Lugar de nacimiento<input class="mt-1 w-full rounded border p-2" formControlName="birth_place"></label><label>Estado de nacimiento<input class="mt-1 w-full rounded border p-2" formControlName="birth_state"></label><label>Ciudad de nacimiento<input class="mt-1 w-full rounded border p-2" formControlName="birth_city"></label><label>Tipo de identificación<select class="mt-1 w-full rounded border p-2" formControlName="official_id_type"><option value="INE">INE</option><option value="PASSPORT">Pasaporte</option><option value="PROFESSIONAL_LICENSE">Cédula profesional</option><option value="OTHER">Otra</option></select></label><label>Número de identificación<input class="mt-1 w-full rounded border p-2" formControlName="official_id_number"></label>
<h2 class="mt-3 text-lg font-bold md:col-span-3">Domicilio</h2><label>Calle<input class="mt-1 w-full rounded border p-2" formControlName="street"></label><label>Número exterior<input class="mt-1 w-full rounded border p-2" formControlName="exterior_number"></label><label>Número interior<input class="mt-1 w-full rounded border p-2" formControlName="interior_number"></label><label>Colonia<input class="mt-1 w-full rounded border p-2" formControlName="neighborhood"></label><label>Código postal<input class="mt-1 w-full rounded border p-2" maxlength="5" formControlName="postal_code"></label><label>Municipio<input class="mt-1 w-full rounded border p-2" formControlName="municipality"></label><label>Ciudad<input class="mt-1 w-full rounded border p-2" formControlName="city"></label><label>Estado<input class="mt-1 w-full rounded border p-2" formControlName="state"></label>
<h2 class="mt-3 text-lg font-bold md:col-span-3">Cuenta bancaria</h2><label>Banco<input class="mt-1 w-full rounded border p-2" formControlName="bank_name"></label><label>Titular<input class="mt-1 w-full rounded border p-2" formControlName="account_holder_name"></label><label>Número de cuenta<input class="mt-1 w-full rounded border p-2" formControlName="account_number"></label><label>CLABE<input class="mt-1 w-full rounded border p-2" maxlength="18" formControlName="clabe"></label>
@if(errorEnvio){<p class="text-red-700 md:col-span-3">{{errorEnvio}}</p>}<div class="flex justify-end gap-3 md:col-span-3"><a routerLink="/clientes" class="rounded border px-4 py-2">Cancelar</a><button class="rounded bg-[#2D452F] px-5 py-2 text-white" [disabled]="form.invalid||enviando">{{enviando?'Registrando…':'Registrar cliente'}}</button></div></form></div>
