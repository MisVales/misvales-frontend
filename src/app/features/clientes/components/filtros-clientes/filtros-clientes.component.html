<form [formGroup]="filtrosForm" class="flex flex-col sm:flex-row items-end gap-3 w-full">
  <div class="flex-1 w-full min-w-[120px]">
    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Sucursal</label>
    <select formControlName="branchId" class="w-full px-3 py-2 text-sm bg-white border border-gray-200 rounded-lg focus:border-[#386641]">
      <option value="">Todas las sucursales</option>
      @for (branch of branches; track branch.id) { <option [value]="branch.id">{{ branch.name }}</option> }
    </select>
  </div>
  <div class="flex-1 w-full min-w-[120px]">
    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Distribuidora</label>
    <select formControlName="distributorId" class="w-full px-3 py-2 text-sm bg-white border border-gray-200 rounded-lg focus:border-[#386641]">
      <option value="">Todas las distribuidoras</option>
      @for (distributor of distributors; track distributor.id) { <option [value]="distributor.id">{{ distributor.numero }} · {{ distributor.nombreCompleto }}</option> }
    </select>
  </div>
  <div class="flex-1 w-full min-w-[120px]">
    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Cartera</label>
    <select formControlName="status" class="w-full px-3 py-2 text-sm bg-white border border-gray-200 rounded-lg focus:border-[#386641]">
      <option value="">Todos los estados</option>
      <option value="PENDING">Pendiente</option>
      <option value="PARTIALLY_PAID">Pago parcial</option>
      <option value="PAID">Pagada</option>
    </select>
  </div>
</form>
