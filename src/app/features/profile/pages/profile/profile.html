<div class="max-w-4xl mx-auto space-y-6">
  <!-- Header -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="h-32 bg-gradient-to-r from-[#386641] to-[#6a994e]"></div>
    <div class="px-6 md:px-8 pb-6 md:pb-8 flex flex-col md:flex-row items-center md:items-end gap-4 md:gap-6">
      <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-md -mt-12 border-4 border-white shrink-0 z-10">
        <lucide-icon name="user" class="w-12 h-12 text-gray-400"></lucide-icon>
      </div>
      
      <div class="flex-1 flex flex-col md:flex-row items-center md:items-start justify-between w-full text-center md:text-left">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">{{ sessionStore.user()?.name }}</h1>
          <p class="text-gray-500">{{ sessionStore.user()?.email }}</p>
        </div>
        <div class="mt-4 md:mt-0 px-3 py-1 bg-green-100 text-green-700 text-sm font-medium rounded-full">
          Activo
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-6">
    <!-- Scopes -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <div class="flex items-center gap-2 mb-4">
        <lucide-icon name="building-2" class="w-5 h-5 text-[#386641]"></lucide-icon>
        <h2 class="text-lg font-semibold text-gray-800">Sucursales y Roles</h2>
      </div>
      
      <div class="space-y-3">
        @for (scope of sessionStore.scopes(); track scope.branchId) {
          <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100">
            <div>
              <p class="font-medium text-gray-800">{{ scope.branchName }}</p>
              <p class="text-sm text-gray-500 font-mono text-[10px]">ID: {{ scope.branchId }}</p>
            </div>
            <div class="px-2 py-1 bg-[#e9ecef] text-gray-700 text-xs font-semibold rounded uppercase tracking-wide">
              {{ scope.role.replace('_', ' ') }}
            </div>
          </div>
        } @empty {
          <p class="text-sm text-gray-500 italic">No tienes sucursales asignadas.</p>
        }
      </div>
    </div>
  </div>
</div>
