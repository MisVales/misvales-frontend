<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-xl shadow-xl max-w-sm w-full overflow-hidden">
    
    <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-amber-50">
      <h3 class="text-lg font-bold text-amber-900 flex items-center gap-2">
        <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        Reenviar Invitación
      </h3>
      <button (click)="cerrar()" class="text-amber-700 hover:text-amber-900">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="p-6 space-y-4">
      
      <p class="text-sm text-gray-600 mb-4">¿Estás seguro de que deseas reenviar el correo de activación? Esto invalidará cualquier enlace anterior.</p>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Motivo del reenvío <span class="text-red-500">*</span></label>
        <textarea formControlName="reason" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] text-sm resize-none" placeholder="Ej. El correo caducó, la distribuidora lo borró por error..."></textarea>
        <app-input-error [control]="form.controls['reason']" label="El motivo del reenvío"></app-input-error>
      </div>

      <div class="pt-4 flex justify-end gap-3 mt-2">
        <button type="button" (click)="cerrar()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">Cancelar</button>
        <button type="submit" [disabled]="form.invalid" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm font-medium transition-colors disabled:opacity-50">Enviar Correo</button>
      </div>

    </form>
  </div>
</div>
