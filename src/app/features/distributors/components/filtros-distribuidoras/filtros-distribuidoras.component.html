<div class="bg-[#F8FAF9] p-3 rounded-2xl border border-gray-200">
  <form
    [formGroup]="filtrosForm"
    (ngSubmit)="aplicarFiltros()"
    class="flex flex-wrap md:flex-nowrap gap-3 items-end"
  >
    <div class="flex-1 min-w-[140px]">
      <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Sucursal</label
      ><refactor-select
        formControlName="branch_id"
        class="w-full px-3 py-2.5 bg-white border border-gray-200 rounded-xl text-sm"
        ><option value="">Todas las sucursales</option>
        @for (branch of branches; track branch.id) {
          <option [value]="branch.id">{{ branch.name }}</option>
        }
      </refactor-select>
    </div>
    <div class="flex-1 min-w-[140px]">
      <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Coordinador</label
      ><refactor-select
        formControlName="coordinator_id"
        class="w-full px-3 py-2.5 bg-white border border-gray-200 rounded-xl text-sm"
        ><option value="">Todos los coordinadores</option>
        @for (coordinator of coordinators; track coordinator.id) {
          <option [value]="coordinator.id">{{ coordinator.name }}</option>
        }
      </refactor-select>
    </div>
    <div class="flex-1 min-w-[140px]">
      <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Categoría</label
      ><refactor-select
        formControlName="category_id"
        class="w-full px-3 py-2.5 bg-white border border-gray-200 rounded-xl text-sm"
        ><option value="">Todas</option>
        @for (category of categories; track category.id) {
          <option [value]="category.id">{{ category.name }}</option>
        }
      </refactor-select>
    </div>
    <div class="flex-1 min-w-[140px]">
      <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Estado</label
      ><refactor-select
        formControlName="status"
        class="w-full px-3 py-2.5 bg-white border border-gray-200 rounded-xl text-sm"
        ><option value="">Todos</option>
        <option value="PENDING_ACTIVATION">Activación pendiente</option>
        <option value="ACTIVE">Activa</option>
        <option value="DISABLED">Deshabilitada</option></refactor-select
      >
    </div>
    <button
      type="submit"
      class="px-4 py-2.5 bg-[#EAEFEA] text-[#1A4D2E] rounded-xl text-sm font-bold border"
    >
      Aplicar filtros
    </button>
  </form>
</div>
