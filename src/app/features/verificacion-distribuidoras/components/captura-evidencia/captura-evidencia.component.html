<div class="captura-container">
  <div class="form-group">
    <label for="evidencia-tipo">Tipo de Evidencia</label>
    <select id="evidencia-tipo" class="form-control" (change)="onTipoChange($event)" [disabled]="isUploading()">
      <option value="">Seleccione...</option>
      @for (tipo of tiposPermitidos(); track tipo.id) {
        <option [value]="tipo.id">{{ tipo.label }}</option>
      }
    </select>
  </div>

  <div class="form-group upload-section">
    <label class="btn-capture" [class.disabled]="!tipoSeleccionado() || isUploading()">
      <span class="icon">📷</span>
      <span>Tomar Fotografía / Seleccionar</span>
      <input 
        #fileInput
        type="file" 
        accept="image/*" 
        capture="environment" 
        (change)="onFileChange($event)" 
        [disabled]="!tipoSeleccionado() || isUploading()"
        style="display: none;"
      >
    </label>
    <p class="help-text">Max. {{ maxSizeMB() }}MB</p>
  </div>

  @if (errorMsg()) {
    <div class="alert alert-danger">
      {{ errorMsg() }}
    </div>
  }

  @if (previewUrl()) {
    <div class="preview-container">
      <img [src]="previewUrl()" alt="Vista previa de evidencia" class="preview-image" />
      <div class="preview-actions">
        <button type="button" class="btn btn-secondary" (click)="cancelar()" [disabled]="isUploading()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="subirEvidencia()" [disabled]="isUploading()">
          @if (isUploading()) {
            Subiendo... {{ progress() }}%
          } @else {
            Subir Evidencia
          }
        </button>
      </div>
      
      @if (isUploading()) {
        <div class="progress-bar-container">
          <div class="progress-bar" [style.width]="progress() + '%'"></div>
        </div>
      }
    </div>
  }
</div>
