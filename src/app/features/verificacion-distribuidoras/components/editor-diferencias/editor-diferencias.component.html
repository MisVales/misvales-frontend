<div class="editor-container">
  <h3 id="editor-diferencia-titulo" class="editor-title">Registrar diferencia</h3>
  <p class="editor-helper">{{ contexto().etiqueta }}</p>
  <div class="form-group readonly-group">
    <label>Dato declarado</label>
    <div class="readonly-value">{{ contexto().datoDeclarado || 'Sin dato' }}</div>
  </div>

  <div class="form-group">
    <label>Dato observado</label>
    <input type="text" class="form-control" [ngModel]="datoObservado()" (ngModelChange)="datoObservado.set($event)" placeholder="¿Qué observaste durante la visita?" [disabled]="isProcessing()">
  </div>

  <div class="form-group">
    <label>Descripción *</label>
    <textarea class="form-control" [ngModel]="descripcion()" (ngModelChange)="descripcion.set($event)" rows="3" placeholder="Describe la diferencia para coordinación." [disabled]="isProcessing()"></textarea>
    @if (submitted() && !datoObservado().trim() && !descripcion().trim()) {
      <p class="text-sm text-danger mt-1">Debes ingresar el dato observado o describir la diferencia encontrada.</p>
    }
  </div>

  <div class="editor-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelar.emit()" [disabled]="isProcessing()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="onGuardar()" [disabled]="isProcessing()">Guardar diferencia</button>
  </div>
</div>
