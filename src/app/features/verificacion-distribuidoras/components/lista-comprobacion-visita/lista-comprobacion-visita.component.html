<div class="comprobacion-list">
  @for (punto of puntos(); track punto.id) {
    <div class="comprobacion-item" [class.readonly]="isReadonly()">
      <div class="punto-info">
        <h4 class="punto-etiqueta">{{ punto.etiqueta }}</h4>
        <div class="punto-declarado">
          <span class="label">Declarado:</span> 
          <span class="value">{{ punto.datoDeclarado || 'No provisto' }}</span>
        </div>
      </div>
      
      <div class="punto-estado">
        <div class="btn-group" role="group">
          <button 
            type="button" 
            class="btn btn-outline-success" 
            [class.active]="punto.estado === 'COMPROBADO'"
            (click)="onEstadoChange(punto, 'COMPROBADO')"
            [disabled]="isReadonly()"
          >
            ✓ Correcto
          </button>
          
          <button 
            type="button" 
            class="btn btn-outline-danger" 
            [class.active]="punto.estado === 'DIFERENCIA'"
            (click)="onEstadoChange(punto, 'DIFERENCIA')"
            [disabled]="isReadonly()"
          >
            ✗ Diferencia
          </button>
          
          <button 
            type="button" 
            class="btn btn-outline-secondary" 
            [class.active]="punto.estado === 'NO_APLICA'"
            (click)="onEstadoChange(punto, 'NO_APLICA')"
            [disabled]="isReadonly()"
          >
            N/A
          </button>
        </div>
      </div>

      @if (punto.estado === 'DIFERENCIA') {
        <div class="punto-diferencia-action">
          @if (punto.diferenciaRegistrada) {
            <span class="diferencia-badge success">Diferencia Registrada</span>
          } @else {
            <button 
              type="button" 
              class="btn btn-warning btn-sm" 
              (click)="onRegistrarDiferencia(punto)"
              [disabled]="isReadonly()"
            >
              Registrar Diferencia
            </button>
            <span class="diferencia-badge warning">Diferencia Pendiente</span>
          }
        </div>
      }
    </div>
  }
</div>
