<div class="min-h-screen bg-[#F8F9F5] p-6 flex flex-col items-center">
  <div class="w-full max-w-2xl bg-white rounded-xl shadow-sm border border-gray-100 p-8">
    <h2 class="text-2xl font-bold text-[#1A4D2E] mb-2">Nuevo Periodo de Canje</h2>
    <p class="text-gray-600 text-sm mb-8">Define las fechas y el valor del punto para el nuevo periodo.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Nombre del Periodo</label>
        <input formControlName="nombre" type="text" class="w-full border-gray-300 rounded-lg focus:ring-[#1A4D2E] focus:border-[#1A4D2E] py-2.5" placeholder="Ej: Campaña Verano 2024">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">Fecha de Inicio</label>
          <input formControlName="fechaInicio" type="datetime-local" class="w-full border-gray-300 rounded-lg focus:ring-[#1A4D2E] focus:border-[#1A4D2E] py-2.5">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">Fecha de Fin</label>
          <input formControlName="fechaFin" type="datetime-local" class="w-full border-gray-300 rounded-lg focus:ring-[#1A4D2E] focus:border-[#1A4D2E] py-2.5">
          <p *ngIf="form.errors?.['fechasInvalidas'] && form.touched" class="text-red-500 text-xs mt-1">La fecha de fin debe ser posterior al inicio.</p>
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Valor del Punto</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="text-gray-500 sm:text-sm">$</span>
          </div>
          <input formControlName="valorPunto" type="text" class="w-full pl-8 border-gray-300 rounded-lg focus:ring-[#1A4D2E] focus:border-[#1A4D2E] py-2.5" placeholder="1.50">
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-6 border-t border-gray-100 mt-8">
        <button type="button" (click)="onCancel()" class="px-5 py-2.5 border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50 transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="form.invalid" [class.opacity-50]="form.invalid" class="px-5 py-2.5 bg-[#1A4D2E] hover:bg-[#133c23] text-white rounded-lg font-medium flex items-center gap-2">
          Guardar Periodo
        </button>
      </div>

    </form>
  </div>
</div>
