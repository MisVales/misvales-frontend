<section class="mx-auto max-w-3xl p-6">
  <a routerLink="/categorias" class="text-sm font-semibold text-[#386641] hover:underline flex items-center gap-1 mb-4">
    ← Volver a categorías
  </a>
  <h1 class="mt-2 text-2xl font-bold text-gray-900">{{ isNew ? 'Nueva categoría' : 'Nueva versión de categoría' }}</h1>
  <p class="text-sm text-gray-600">Los cambios crean historial; una versión publicada no se sobrescribe.</p>

  @if (error()) {
    <div role="alert" class="my-4 rounded-lg bg-red-50 p-3 text-red-700 text-sm border border-red-200">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()" class="mt-6 grid gap-4 rounded-2xl border border-gray-100 bg-white p-6 shadow-sm md:grid-cols-2">
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-700 mb-1">Código *</label>
      <input formControlName="code" class="w-full rounded-lg border border-gray-300 p-2 text-sm focus:outline-none focus:border-[#386641]" placeholder="CAT-BASE">
      <app-input-error [control]="form.controls.code" label="El código"></app-input-error>
    </div>

    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-700 mb-1">Nombre *</label>
      <input formControlName="name" class="w-full rounded-lg border border-gray-300 p-2 text-sm focus:outline-none focus:border-[#386641]">
      <app-input-error [control]="form.controls.name" label="El nombre"></app-input-error>
    </div>

    <div class="md:col-span-2">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-700 mb-1">Descripción</label>
      <textarea formControlName="description" class="w-full rounded-lg border border-gray-300 p-2 text-sm focus:outline-none focus:border-[#386641]" rows="2"></textarea>
      <app-input-error [control]="form.controls.description" label="La descripción"></app-input-error>
    </div>

    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-700 mb-1">Porcentaje de ganancia (0 a 1) *</label>
      <input formControlName="profit_percentage" class="w-full rounded-lg border border-gray-300 p-2 text-sm font-mono focus:outline-none focus:border-[#386641]" placeholder="0.1500">
      <app-input-error [control]="form.controls.profit_percentage" label="El porcentaje de ganancia" [customMessages]="{ pattern: 'Debe ser un número decimal entre 0 y 1 (ejemplo: 0.1500).' }"></app-input-error>
    </div>

    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-700 mb-1">Vigente desde *</label>
      <input type="date" formControlName="effective_from" class="w-full rounded-lg border border-gray-300 p-2 text-sm focus:outline-none focus:border-[#386641]">
      <app-input-error [control]="form.controls.effective_from" label="La fecha de vigencia"></app-input-error>
    </div>

    <div class="md:col-span-2">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-700 mb-1">Motivo / Justificación *</label>
      <textarea formControlName="reason" class="w-full rounded-lg border border-gray-300 p-2 text-sm focus:outline-none focus:border-[#386641]" rows="2" placeholder="Justificación obligatoria del cambio..."></textarea>
      <app-input-error [control]="form.controls.reason" label="El motivo"></app-input-error>
    </div>

    <div class="md:col-span-2 flex justify-end pt-2 border-t border-gray-100">
      <button type="submit" [disabled]="form.invalid || saving()" class="rounded-xl bg-[#386641] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#2c5234] disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">
        {{ saving() ? 'Guardando...' : (isNew ? 'Crear borrador' : 'Crear nueva versión') }}
      </button>
    </div>
  </form>
</section>
