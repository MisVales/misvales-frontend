<section class="mx-auto max-w-3xl p-6"><a routerLink="/categorias" class="text-sm font-semibold text-[#386641]">← Volver a categorías</a><h1 class="mt-4 text-2xl font-bold">{{ isNew ? 'Nueva categoría' : 'Nueva versión de categoría' }}</h1><p class="text-sm text-gray-600">Los cambios crean historial; una versión publicada no se sobrescribe.</p>
@if (error()) { <div role="alert" class="my-4 rounded-lg bg-red-50 p-3 text-red-700">{{ error() }}</div> }
<form [formGroup]="form" (ngSubmit)="guardar()" class="mt-6 grid gap-4 rounded-2xl border bg-white p-6 shadow-sm md:grid-cols-2">
<label class="text-sm font-semibold">Código<input formControlName="code" class="mt-1 w-full rounded-lg border p-2" placeholder="CAT-BASE"></label><label class="text-sm font-semibold">Nombre<input formControlName="name" class="mt-1 w-full rounded-lg border p-2"></label>
<label class="text-sm font-semibold md:col-span-2">Descripción<textarea formControlName="description" class="mt-1 w-full rounded-lg border p-2"></textarea></label>
<label class="text-sm font-semibold">Porcentaje de ganancia (0 a 1)<input formControlName="profit_percentage" class="mt-1 w-full rounded-lg border p-2" placeholder="0.1500"></label><label class="text-sm font-semibold">Vigente desde<input type="date" formControlName="effective_from" class="mt-1 w-full rounded-lg border p-2"></label>
<label class="text-sm font-semibold md:col-span-2">Motivo<textarea formControlName="reason" class="mt-1 w-full rounded-lg border p-2" placeholder="Justificación obligatoria"></textarea></label>
<div class="md:col-span-2 flex justify-end"><button type="submit" [disabled]="saving()" class="rounded-lg bg-[#386641] px-5 py-2 font-semibold text-white disabled:opacity-50">{{ saving() ? 'Guardando...' : (isNew ? 'Crear borrador' : 'Crear nueva versión') }}</button></div>
</form></section>
