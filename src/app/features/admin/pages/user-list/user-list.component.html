<div class="admin-container">
  <div class="header-actions">
    <h2>Gestión de Usuarios</h2>
    <button class="btn-primary" (click)="showInviteModal.set(true)">+ Invitar Usuario</button>
  </div>

  <div class="filters">
    <select [ngModel]="filterStatus()" (ngModelChange)="filterStatus.set($event)">
      <option value="">Todos los Estados</option>
      <option value="active">Activo</option>
      <option value="invited">Invitado</option>
      <option value="blocked">Bloqueado</option>
    </select>
    
    <select [ngModel]="filterRole()" (ngModelChange)="filterRole.set($event)">
      <option value="">Todos los Roles</option>
      <option value="admin">Administrador</option>
      <option value="gerente">Gerente</option>
      <option value="cajero">Cajero</option>
    </select>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (user of filteredUsers(); track user.id) {
        <tr>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span class="role-badge">{{ user.roles[0] }}</span>
          </td>
          <td>
            <span class="status-badge" [class]="user.status">{{ user.status }}</span>
          </td>
          <td>
            <button class="btn-action" 
                    [disabled]="isActionLoading() === 'block-' + user.id"
                    (click)="toggleBlock(user)">
              @if (isActionLoading() === 'block-' + user.id) {
                Procesando...
              } @else {
                {{ user.status === 'blocked' ? 'Desbloquear' : 'Bloquear' }}
              }
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="empty-state">No se encontraron usuarios.</td>
        </tr>
      }
    </tbody>
  </table>
</div>

@if (showInviteModal()) {
  <div class="modal-backdrop">
    <div class="modal-content">
      <h3>Invitar Nuevo Usuario</h3>
      <div class="form-group">
        <label>Email del usuario</label>
        <input type="email" [ngModel]="inviteEmail()" (ngModelChange)="inviteEmail.set($event)" placeholder="correo@ejemplo.com">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" (click)="showInviteModal.set(false)">Cancelar</button>
        <button class="btn-primary" 
                [disabled]="!inviteEmail() || isActionLoading() === 'invite'" 
                (click)="inviteUser()">
          {{ isActionLoading() === 'invite' ? 'Enviando...' : 'Enviar Invitación' }}
        </button>
      </div>
    </div>
  </div>
}
