<main class="min-h-screen bg-[#F8F9FA] flex flex-col relative font-sans" aria-labelledby="login-title">
  <!-- Encabezado superior discreto -->
  <!-- Contenedor central -->
  <div class="flex-grow flex items-center justify-center p-4">
    <!-- Tarjeta de Login -->
    <div class="bg-white rounded-2xl p-6 sm:p-8 max-w-[28rem] w-full border border-gray-200">
      
      <!-- Encabezado de la tarjeta -->
      <div class="text-center mb-8">
        <h1 id="login-title" class="text-3xl font-extrabold text-[#386641] tracking-tight">MisVales</h1>
        <p class="text-gray-500 text-sm mt-2">Acceso seguro a su portal financiero.</p>
      </div>

      <!-- Mensaje de Error (del Facade) -->
      <div *ngIf="error" class="mb-6 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-200" role="alert">
        {{ error }}
      </div>

      <!-- Formulario Login Clásico -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Campo: Correo Electrónico -->
        <div>
          <label for="email" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
            Correo Electrónico *
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <input type="email" id="email" formControlName="email" autocomplete="username"
                   class="block w-full pl-10 pr-3 py-3 border border-[#B08968]/40 rounded-lg text-gray-900 focus:outline-none focus:border-[#386641] focus:ring-1 focus:ring-[#386641] sm:text-sm transition-colors placeholder-gray-400"
                   placeholder="nombre@empresa.com">
          </div>
          <app-input-error [control]="loginForm.controls.email" label="El correo electrónico" [serverError]="fieldError('email')"></app-input-error>
        </div>

        <!-- Campo: Contraseña -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider">
              Contraseña *
            </label>
            <a routerLink="/auth/recuperar-acceso" class="text-xs text-[#6A994E] hover:underline font-medium">
              ¿Olvidó su contraseña?
            </a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input type="password" id="password" formControlName="password" autocomplete="current-password"
                   class="block w-full pl-10 pr-3 py-3 border border-[#B08968]/40 rounded-lg text-gray-900 focus:outline-none focus:border-[#386641] focus:ring-1 focus:ring-[#386641] sm:text-sm transition-colors placeholder-gray-400"
                   placeholder="••••••••">
          </div>
          <app-input-error [control]="loginForm.controls.password" label="La contraseña" [serverError]="fieldError('password')"></app-input-error>
        </div>

        <!-- Botón Ingresar -->
        <button type="submit" 
                [disabled]="isLoading || loginForm.invalid"
                class="w-full bg-[#386641] hover:bg-[#6A994E] disabled:bg-[#386641]/70 disabled:cursor-not-allowed text-white font-medium py-3 px-4 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 mt-4">
          
          <ng-container *ngIf="!isLoading">
            Ingresar
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
            </svg>
          </ng-container>

          <ng-container *ngIf="isLoading">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Procesando...
          </ng-container>

        </button>



      </form>


    </div>
  </div>
</main>
