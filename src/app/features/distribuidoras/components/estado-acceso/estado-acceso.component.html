<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
  <div class="flex items-center justify-between mb-4">
    <h3 class="font-bold text-gray-900">Acceso a la Plataforma</h3>
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-gray-100 text-gray-700 text-xs font-bold uppercase tracking-wider">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      {{ distribuidora.estadoAcceso }}
    </span>
  </div>

  <div class="space-y-4">
    <div>
      <p class="text-xs text-gray-500 mb-1">Correo Enmascarado</p>
      <p class="font-medium text-gray-900 font-mono">c***@gmail.com</p>
    </div>

    <!-- Acciones según estado (Ejemplo) -->
    <div *ngIf="distribuidora.estadoAcceso === 'INVITED' || distribuidora.estadoAcceso === 'PENDING_ACTIVATION'" class="pt-4 border-t border-gray-100">
      <button (click)="reenviarInvitacion()" class="w-full py-2 bg-white border border-[#C1E1C1] text-[#1A4D2E] hover:bg-[#F4F8F4] rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        Reenviar Invitación
      </button>
      <p class="text-[10px] text-gray-400 text-center mt-2">No se muestra el token por seguridad.</p>
    </div>
  </div>
</div>
