<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden flex flex-col">
    
    <div class="px-6 py-5 flex justify-between items-center">
      <h3 class="text-xl font-bold text-[#1A4D2E]">Asignar Categoría</h3>
      <button type="button" (click)="cerrar()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="px-6 pb-6 flex-1 overflow-y-auto">
      
      <div class="p-4 bg-[#E8F3E8] text-[#1A4D2E] rounded-xl border border-[#d2dfd2] mb-6 flex gap-3">
        <div class="mt-0.5 shrink-0">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
        </div>
        <div>
          <h4 class="font-bold text-sm mb-1">Impacto en Vales Futuros</h4>
          <p class="text-[13px] opacity-90 leading-relaxed">El cambio de categoría se aplicará únicamente a los vales generados a partir de la fecha de inicio seleccionada. Los vales emitidos previamente mantendrán su categoría original.</p>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wide mb-1.5">Nueva Categoría</label>
          <select formControlName="category_version_id" class="w-full px-4 py-3 border border-[#E8EEE8] rounded-xl focus:outline-none focus:border-[#1A4D2E] focus:ring-1 focus:ring-[#1A4D2E] text-sm bg-white text-gray-800 transition-colors">
            <option value="">Seleccione una categoría...</option>
            <option *ngFor="let cat of categoriasDisponibles" [value]="cat.id" [disabled]="cat.id === categoriaActualId">
              {{ cat.nombre }}
            </option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wide mb-1.5">Fecha de Inicio</label>
          <input type="date" formControlName="starts_at" class="w-full px-4 py-3 border border-[#E8EEE8] rounded-xl focus:outline-none focus:border-[#1A4D2E] focus:ring-1 focus:ring-[#1A4D2E] text-sm text-gray-800 transition-colors bg-white">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wide mb-1.5">Motivo del Cambio</label>
          <textarea formControlName="reason" rows="3" class="w-full px-4 py-3 border border-[#E8EEE8] rounded-xl focus:outline-none focus:border-[#1A4D2E] focus:ring-1 focus:ring-[#1A4D2E] text-sm resize-none text-gray-800 transition-colors" placeholder="Detalle la justificación para este cambio de categoría..."></textarea>
        </div>
      </div>

      <div class="pt-8 flex justify-end gap-3 mt-auto">
        <button type="button" (click)="cerrar()" class="px-5 py-2.5 border border-gray-200 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-50 transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="form.invalid" class="px-5 py-2.5 bg-[#1A4D2E] hover:bg-[#133c23] text-white rounded-xl text-sm font-bold transition-colors disabled:opacity-50 flex items-center gap-2 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
          Guardar Cambios
        </button>
      </div>

    </form>
  </div>
</div>
