<section class="p-6">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">
      @if (isNew()) { Nuevo Producto } @else { Detalle de Producto }
    </h1>
  </div>

  <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2" for="nombre">Nombre</label>
          <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="nombre" type="text" formControlName="nombre">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2" for="descripcion">Descripción</label>
          <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="descripcion" type="text" formControlName="descripcion">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2" for="montoNominal">Monto Nominal (Múltiplo de 100)</label>
          <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="montoNominal" type="text" formControlName="montoNominal">
          @if (form.get('montoNominal')?.errors?.['notMultiple100']) {
            <p class="text-red-500 text-xs italic">El monto debe ser múltiplo de 100.</p>
          }
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2" for="comisionPrestamo">% Comisión de Préstamo</label>
          <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="comisionPrestamo" type="text" formControlName="comisionPrestamo">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2" for="interesQuincenal">% Interés Quincenal</label>
          <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="interesQuincenal" type="text" formControlName="interesQuincenal">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2" for="seguro">Seguro</label>
          <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="seguro" type="text" formControlName="seguro">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2" for="numeroQuincenas">Número de Quincenas</label>
          <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="numeroQuincenas" type="number" formControlName="numeroQuincenas">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2" for="inicioVigencia">Inicio de Vigencia</label>
          <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="inicioVigencia" type="date" formControlName="inicioVigencia">
        </div>

      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="motivo">Motivo (Auditoría)</label>
        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="motivo" type="text" formControlName="motivo">
      </div>

      <div class="flex items-center justify-between">
        <a routerLink="/productos" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
          Volver
        </a>
        @if (canWrite()) {
          <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit" [disabled]="form.invalid">
            Guardar
          </button>
        }
      </div>
    </form>
  </div>
</section>
