<div class="container mx-auto max-w-3xl p-4"><a routerLink="/productos" class="text-blue-600 hover:underline">&larr; Volver a Productos</a><h2 class="my-4 text-2xl font-bold">{{ isNew() ? 'Nuevo Producto' : 'Crear nueva versión del producto' }}</h2>
<form [formGroup]="form" (ngSubmit)="guardar()" class="grid gap-4 rounded bg-white p-8 shadow md:grid-cols-2">
  <label>Código<input class="mt-1 w-full rounded border p-2" formControlName="code"></label><label>Nombre<input class="mt-1 w-full rounded border p-2" formControlName="name"></label>
  <label class="md:col-span-2">Descripción<textarea class="mt-1 w-full rounded border p-2" formControlName="description"></textarea></label>
  <label>Valor nominal<input class="mt-1 w-full rounded border p-2" type="number" step="100" formControlName="nominal_amount"></label><label>Quincenas<input class="mt-1 w-full rounded border p-2" type="number" formControlName="fortnights_count"></label>
  <label>Comisión de préstamo (0 a 1)<input class="mt-1 w-full rounded border p-2" type="number" step="0.000001" formControlName="loan_commission_percentage"></label><label>Interés simple (0 a 1)<input class="mt-1 w-full rounded border p-2" type="number" step="0.000001" formControlName="simple_interest_percentage"></label>
  <label>Importe del seguro<input class="mt-1 w-full rounded border p-2" type="number" step="0.01" formControlName="insurance_amount"></label><label>Vigente desde<input class="mt-1 w-full rounded border p-2" type="date" formControlName="effective_from"></label>
  <label class="md:col-span-2">Motivo<textarea class="mt-1 w-full rounded border p-2" formControlName="reason"></textarea></label>
  @if(error()){<p class="text-red-700 md:col-span-2">{{error()}}</p>} @if(canWrite()){<button class="rounded bg-blue-600 px-4 py-2 text-white md:col-span-2" [disabled]="form.invalid || saving()">{{saving()?'Guardando…':(isNew()?'Crear producto':'Crear versión')}}</button>}
</form></div>
