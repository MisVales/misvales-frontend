<div class="container mx-auto p-4 max-w-2xl">
  <div class="mb-4">
    <a routerLink="/periodos-canje" class="text-blue-500 hover:underline flex items-center">
      &larr; Volver a Periodos de Canje
    </a>
  </div>
  <h2 class="text-2xl font-bold mb-4">{{ isNew() ? 'Nuevo Periodo de Canje' : 'Detalle de Periodo' }}</h2>
  
  <form [formGroup]="form" (ngSubmit)="guardar()" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
    
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="nombre">
        Nombre
      </label>
      <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
             id="nombre" type="text" formControlName="nombre">
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="fechaInicio">
        Fecha Inicio
      </label>
      <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
             id="fechaInicio" type="date" formControlName="fechaInicio">
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="fechaFin">
        Fecha Fin
      </label>
      <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
             id="fechaFin" type="date" formControlName="fechaFin">
    </div>

    @if (canWrite()) {
      <div class="flex items-center justify-between mt-6">
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" 
                type="submit" [disabled]="form.invalid || store.operacionEnProceso() !== null">
          Guardar Cambios
        </button>
      </div>
    }
  </form>
</div>
