<div class="container mx-auto max-w-3xl p-4">
  <a routerLink="/periodos-canje" class="text-[#386641] hover:underline flex items-center gap-1 text-sm font-medium mb-4">
    &larr; Volver a Periodos de Canje
  </a>
  <h2 class="my-4 text-2xl font-bold text-gray-900">
    {{ isNew() ? 'Nuevo Periodo de Canje' : 'Editar Periodo de Canje' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="grid gap-4 rounded-xl bg-white p-8 shadow-sm border border-gray-100 md:grid-cols-2">
    <div>
      <label class="block text-xs font-semibold text-gray-700 mb-1">Código *</label>
      <input class="w-full rounded-lg border border-gray-300 p-2 text-sm focus:outline-none focus:border-[#386641]" formControlName="code" placeholder="Ej. PER-2026-01">
      <app-input-error [control]="form.controls.code" label="El código"></app-input-error>
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-700 mb-1">Nombre *</label>
      <input class="w-full rounded-lg border border-gray-300 p-2 text-sm focus:outline-none focus:border-[#386641]" formControlName="name" placeholder="Ej. Enero 2026 Quincena 1">
      <app-input-error [control]="form.controls.name" label="El nombre"></app-input-error>
    </div>

    <div class="md:col-span-2">
      <label class="block text-xs font-semibold text-gray-700 mb-1">Descripción</label>
      <textarea class="w-full rounded-lg border border-gray-300 p-2 text-sm focus:outline-none focus:border-[#386641]" formControlName="description" rows="2" placeholder="Opcional"></textarea>
      <app-input-error [control]="form.controls.description" label="La descripción"></app-input-error>
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-700 mb-1">Fecha y Hora de Inicio *</label>
      <input class="w-full rounded-lg border border-gray-300 p-2 text-sm focus:outline-none focus:border-[#386641]" type="datetime-local" formControlName="starts_at">
      <app-input-error [control]="form.controls.starts_at" label="La fecha de inicio"></app-input-error>
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-700 mb-1">Fecha y Hora de Fin *</label>
      <input class="w-full rounded-lg border border-gray-300 p-2 text-sm focus:outline-none focus:border-[#386641]" type="datetime-local" formControlName="ends_at">
      <app-input-error [control]="form.controls.ends_at" label="La fecha de fin"></app-input-error>
    </div>

    <div class="md:col-span-2">
      <label class="block text-xs font-semibold text-gray-700 mb-1">Motivo / Justificación *</label>
      <textarea class="w-full rounded-lg border border-gray-300 p-2 text-sm focus:outline-none focus:border-[#386641]" formControlName="reason" rows="2" placeholder="Motivo del alta o cambio del periodo..."></textarea>
      <app-input-error [control]="form.controls.reason" label="El motivo"></app-input-error>
    </div>

    @if (error()) {
      <p class="text-xs text-red-700 bg-red-50 p-3 rounded-lg border border-red-200 md:col-span-2">{{ error() }}</p>
    }

    @if (canWrite()) {
      <button class="rounded-xl bg-[#386641] px-5 py-2.5 text-sm font-semibold text-white md:col-span-2 hover:bg-[#2c5234] disabled:opacity-50 disabled:cursor-not-allowed transition-colors" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Guardando…' : 'Guardar Periodo' }}
      </button>
    }
  </form>
</div>
