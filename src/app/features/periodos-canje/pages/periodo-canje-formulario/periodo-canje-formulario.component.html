<div class="container mx-auto max-w-3xl p-4"><a routerLink="/periodos-canje" class="text-blue-600 hover:underline">&larr; Volver a Periodos de Canje</a><h2 class="my-4 text-2xl font-bold">{{isNew()?'Nuevo Periodo de Canje':'Editar Periodo de Canje'}}</h2>
<form [formGroup]="form" (ngSubmit)="guardar()" class="grid gap-4 rounded bg-white p-8 shadow md:grid-cols-2"><label>Código<input class="mt-1 w-full rounded border p-2" formControlName="code"></label><label>Nombre<input class="mt-1 w-full rounded border p-2" formControlName="name"></label><label class="md:col-span-2">Descripción<textarea class="mt-1 w-full rounded border p-2" formControlName="description"></textarea></label><label>Inicio<input class="mt-1 w-full rounded border p-2" type="datetime-local" formControlName="starts_at"></label><label>Fin<input class="mt-1 w-full rounded border p-2" type="datetime-local" formControlName="ends_at"></label><label class="md:col-span-2">Motivo<textarea class="mt-1 w-full rounded border p-2" formControlName="reason"></textarea></label>@if(error()){<p class="text-red-700 md:col-span-2">{{error()}}</p>}@if(canWrite()){<button class="rounded bg-blue-600 px-4 py-2 text-white md:col-span-2" [disabled]="form.invalid||saving()">{{saving()?'Guardando…':'Guardar'}}</button>}</form></div>
