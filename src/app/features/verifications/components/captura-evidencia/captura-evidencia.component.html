<div class="captura-container">
  <div class="form-group">
    <label for="evidencia-tipo">Tipo de Evidencia</label>
    <refactor-select
      id="evidencia-tipo"
      class="form-control"
      (change)="onTipoChange($event)"
      [disabled]="isUploading()"
    >
      <option value="">Seleccione...</option>
      @for (tipo of tiposPermitidos(); track tipo.id) {
        <option [value]="tipo.id">{{ tipo.label }}</option>
      }
    </refactor-select>
  </div>

  <div class="form-group upload-section">
    <label class="btn-capture" [class.disabled]="!tipoSeleccionado() || isUploading()">
      <span class="icon">📷</span>
      <span>Tomar Fotografía / Seleccionar</span>
      <input
        #fileInput
        type="file"
        accept="image/jpeg,image/png,image/webp,application/pdf"
        (change)="onFileChange($event)"
        [disabled]="!tipoSeleccionado() || isUploading()"
        style="display: none"
      />
    </label>
    <p class="help-text">Max. {{ maxSizeMB() }}MB</p>
  </div>

  @if (errorMsg()) {
    <div class="alert alert-danger">
      {{ errorMsg() }}
    </div>
  }

  @if (archivoSeleccionado()) {
    <div class="preview-container">
      <app-attachment-preview [file]="archivoSeleccionado()!"></app-attachment-preview>

      <div class="preview-actions mt-4">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="cancelar()"
          [disabled]="isUploading()"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="subirEvidencia()"
          [disabled]="isUploading()"
        >
          @if (isUploading()) {
            Subiendo... {{ progress() }}%
          } @else {
            Subir Evidencia
          }
        </button>
      </div>

      @if (isUploading()) {
        <div class="progress-bar-container">
          <div class="progress-bar" [style.width]="progress() + '%'"></div>
        </div>
      }
    </div>
  }
</div>
