<div class="flex-1 flex flex-col h-full">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-gray-900">Referencias Familiares</h2>
    <button *ngIf="store.detalle()?.estado === 'DRAFT'" (click)="agregarFamiliar()" class="bg-[#1A4D2E] hover:bg-[#133c23] text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
      Agregar Familiar
    </button>
  </div>

  <div *ngIf="cargando" class="text-gray-500 py-8 text-center">Cargando familiares...</div>

  <div *ngIf="!cargando && familiaresArray.length === 0" class="border border-gray-200 border-dashed rounded-xl p-8 flex flex-col items-center justify-center text-center bg-gray-50">
    <svg class="w-10 h-10 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
    <p class="text-sm text-gray-500 max-w-[250px]">No hay familiares registrados en el expediente.</p>
  </div>

  <div *ngIf="!cargando && familiaresArray.length > 0" class="space-y-6">
    <div *ngFor="let form of familiaresGroups; let i = index" [formGroup]="form" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 relative">
      
      <div class="absolute right-4 top-4 flex gap-2" *ngIf="store.detalle()?.estado === 'DRAFT'">
        <button (click)="guardarFamiliar(i)" [disabled]="form.pristine || form.invalid" class="text-[#1A4D2E] hover:text-[#133c23] p-1 disabled:opacity-50" title="Guardar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
        </button>
        <button (click)="form.value.id ? eliminarFamiliarAPI(i, form.value.id) : removerFamiliarVisual(i)" class="text-red-500 hover:text-red-700 p-1" title="Eliminar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-2">
        
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Parentesco <span class="text-red-500">*</span></label>
          <select formControlName="relationship" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] bg-white text-sm">
            <option value="">Seleccionar...</option>
            <option value="SPOUSE">Esposo(a)</option>
            <option value="PARTNER">Pareja</option>
            <option value="CHILD">Hijo(a)</option>
            <option value="FATHER">Padre</option>
            <option value="MOTHER">Madre</option>
            <option value="SIBLING">Hermano(a)</option>
            <option value="OTHER">Otro</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Nombre(s) <span class="text-red-500">*</span></label>
          <input type="text" formControlName="first_name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Apellido Paterno <span class="text-red-500">*</span></label>
          <input type="text" formControlName="first_last_name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Apellido Materno</label>
          <input type="text" formControlName="second_last_name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Fecha de Nacimiento <span class="text-red-500">*</span></label>
          <input type="date" formControlName="birth_date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Edad Declarada</label>
          <input type="number" formControlName="declared_age" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] text-sm">
        </div>

      </div>
      
      <div class="mt-4 flex items-center gap-2">
        <input type="checkbox" formControlName="is_family_reference" id="ref-{{i}}" class="rounded border-gray-300 text-[#1A4D2E] focus:ring-[#1A4D2E]">
        <label for="ref-{{i}}" class="text-sm text-gray-700 font-medium">Usar como Referencia Familiar</label>
      </div>
    </div>
  </div>
</div>
