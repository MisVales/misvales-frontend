<div class="flex-1 flex flex-col h-full">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-gray-900">Historial Laboral (Empleos)</h2>
    <button *ngIf="store.detalle()?.estado === 'DRAFT'" (click)="agregarEmpleo()" class="bg-[#1A4D2E] hover:bg-[#133c23] text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
      Agregar Empleo
    </button>
  </div>

  <div *ngIf="cargando" class="text-gray-500 py-8 text-center">Cargando empleos...</div>

  <div *ngIf="!cargando && empleosArray.length === 0" class="border border-gray-200 border-dashed rounded-xl p-8 flex flex-col items-center justify-center text-center bg-gray-50">
    <svg class="w-10 h-10 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
    <p class="text-sm text-gray-500 max-w-[250px]">No hay empleos registrados en el expediente.</p>
  </div>

  <div *ngIf="!cargando && empleosArray.length > 0" class="space-y-6">
    <div *ngFor="let form of empleosGroups; let i = index" [formGroup]="form" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 relative">
      
      <div class="absolute right-4 top-4 flex gap-2" *ngIf="store.detalle()?.estado === 'DRAFT'">
        <button (click)="guardarEmpleo(i)" [disabled]="form.pristine || form.invalid" class="text-[#1A4D2E] hover:text-[#133c23] p-1 disabled:opacity-50" title="Guardar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
        </button>
        <button (click)="form.value.id ? eliminarEmpleoAPI(i, form.value.id) : removerEmpleoVisual(i)" class="text-red-500 hover:text-red-700 p-1" title="Eliminar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-700 mb-1">Empresa / Patrón <span class="text-red-500">*</span></label>
          <input type="text" formControlName="employer_name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] text-sm">
          <app-input-error [control]="form.controls['employer_name']" label="El nombre de la empresa"></app-input-error>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Puesto <span class="text-red-500">*</span></label>
          <input type="text" formControlName="job_title" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] text-sm">
          <app-input-error [control]="form.controls['job_title']" label="El puesto"></app-input-error>
        </div>
        
        <div></div> <!-- spacer -->

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Fecha de Inicio <span class="text-red-500">*</span></label>
          <input type="date" formControlName="started_at" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] text-sm">
          <app-input-error [control]="form.controls['started_at']" label="La fecha de inicio"></app-input-error>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Fecha de Terminación</label>
          <input type="date" formControlName="ended_at" [attr.disabled]="form.value.is_current ? true : null" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] text-sm disabled:bg-gray-100 disabled:opacity-75">
          <app-input-error [control]="form.controls['ended_at']" label="La fecha de terminación" [customMessages]="{ dateRangeInvalid: 'La fecha final no puede ser menor a la fecha inicial.' }"></app-input-error>
        </div>
      </div>
      
      <div class="mt-4 flex items-center gap-2">
        <input type="checkbox" formControlName="is_current" id="is_curr_emp_{{i}}" (change)="form.value.is_current ? form.get('ended_at')?.setValue('') : null" class="rounded border-gray-300 text-[#1A4D2E] focus:ring-[#1A4D2E]">
        <label for="is_curr_emp_{{i}}" class="text-sm text-gray-700 font-medium">Es el empleo actual</label>
      </div>
    </div>
  </div>
</div>
