<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 relative">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-gray-900">Datos Personales</h2>
    
    <!-- Indicador de Autosave -->
    <div class="text-sm font-medium">
      <span *ngIf="autosaveStatus === 'saving'" class="text-gray-500 flex items-center gap-1">
        <svg class="animate-spin h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
        Guardando...
      </span>
      <span *ngIf="autosaveStatus === 'saved'" class="text-green-600 flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        Guardado
      </span>
      <span *ngIf="autosaveStatus === 'error'" class="text-red-500 flex items-center gap-1">
        No se pudo guardar · <button type="button" (click)="saveFn(form.value)" class="underline hover:text-red-600">Reintentar</button>
      </span>
    </div>
  </div>

  <form [formGroup]="form" [appAutosave]="form" [saveFn]="saveFn" (statusChange)="autosaveStatus = $event" class="space-y-6">
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Nombre -->
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Nombre(s) <span class="text-red-500">*</span></label>
        <input type="text" formControlName="first_name" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E]">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Apellido Paterno <span class="text-red-500">*</span></label>
        <input type="text" formControlName="first_last_name" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E]">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Apellido Materno</label>
        <input type="text" formControlName="second_last_name" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E]">
      </div>

      <!-- CURP -->
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">CURP <span class="text-red-500">*</span></label>
        <div class="relative flex items-center">
          <input type="text" formControlName="curp" [readonly]="isCurpMasked" [class.bg-gray-50]="isCurpMasked" [class.text-gray-500]="isCurpMasked" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] uppercase">
          <button type="button" *ngIf="isCurpMasked" (click)="editarCurp()" class="absolute right-2 text-xs font-semibold text-[#1A4D2E] hover:underline bg-gray-50 px-2">Editar</button>
        </div>
        <p *ngIf="form.controls['curp'].hasError('invalidCurp') && !isCurpMasked" class="text-red-500 text-xs mt-1">Formato de CURP inválido.</p>
      </div>

      <!-- RFC -->
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">RFC</label>
        <input type="text" formControlName="rfc" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] uppercase">
        <p *ngIf="form.controls['rfc'].hasError('invalidRfc')" class="text-red-500 text-xs mt-1">Formato de RFC inválido.</p>
      </div>

      <!-- Fecha Nacimiento -->
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Fecha de Nacimiento <span class="text-red-500">*</span></label>
        <input type="date" formControlName="birth_date" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E]">
      </div>

      <!-- Lugar Nacimiento -->
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Lugar de Nacimiento</label>
        <input type="text" formControlName="birth_place" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E]">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Estado de Nacimiento</label>
        <input type="text" formControlName="birth_state" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E]">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Ciudad de Nacimiento</label>
        <input type="text" formControlName="birth_city" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E]">
      </div>

      <!-- Contacto -->
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Correo Electrónico <span class="text-red-500">*</span></label>
        <input type="email" formControlName="email" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E]">
        <p *ngIf="form.controls['email'].invalid && form.controls['email'].touched" class="text-red-500 text-xs mt-1">Correo inválido.</p>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Teléfono <span class="text-red-500">*</span></label>
        <input type="tel" formControlName="phone_number" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E]">
        <p *ngIf="form.controls['phone_number'].invalid && form.controls['phone_number'].touched" class="text-red-500 text-xs mt-1">Teléfono a 10 dígitos requerido.</p>
      </div>
    </div>

    <!-- Identificación -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-gray-100">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Tipo de Identificación Oficial <span class="text-red-500">*</span></label>
        <select formControlName="official_id_type" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E] bg-white">
          <option value="">Seleccionar...</option>
          <option value="INE">INE</option>
          <option value="PASSPORT">Pasaporte</option>
          <option value="PROFESSIONAL_LICENSE">Cédula Profesional</option>
          <option value="OTHER">Otro</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Número de Identificación <span class="text-red-500">*</span></label>
        <input type="text" formControlName="official_id_number" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1A4D2E]">
      </div>
    </div>

    <!-- Acciones -->
    <div *ngIf="store.errorConcurrencia()" class="mt-8 pt-4 border-t border-gray-100 flex items-center justify-between gap-3">
       <span class="text-red-500 text-sm font-medium">{{ store.error() }}</span>
    </div>

  </form>
</div>
