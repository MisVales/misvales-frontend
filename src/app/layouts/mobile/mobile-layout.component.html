<div class="mobile-shell">
  <header>
    <a routerLink="/distribuidora">MisVales</a>
    <button type="button" aria-label="Opciones de sesión">Sesión</button>
  </header>

  <main>
    <router-outlet />
    <section class="intro">
      <p class="eyebrow">Experiencia distribuidora</p>
      <h1>Todo listo para comenzar</h1>
      <p>Las tarjetas, resúmenes y acciones de negocio se incorporan en sus etapas asignadas.</p>
    </section>
  </main>

  <nav aria-label="Navegación de distribuidora">
    @for (item of navigation(); track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
    } @empty {
      <span>Navegación pendiente</span>
    }
  </nav>
</div>
