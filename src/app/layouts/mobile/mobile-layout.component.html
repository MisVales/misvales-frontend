<div class="mobile-shell">
  <header>
    <a [routerLink]="homePath">MisVales</a>
    <mv-logout-button />
  </header>

  <main>
    <router-outlet />
  </main>

  <nav aria-label="Navegación de distribuidora">
    @for (item of navigation(); track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
    } @empty {
      <span>Navegación pendiente</span>
    }
  </nav>
</div>
